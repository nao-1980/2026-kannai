  var h='<div class="legend"><span><span class="tag tg-st">ステージ</span>パフォーマンス開始</span><span><span class="tag tg-mc">MC</span>事前説明・呼び込み</span><span><span class="tag tg-fm">マリンFM</span>放送</span><span><span class="tag tg-sec">警備</span>警備・規制</span><span><span class="tag tg-all">全員集合</span>集合・打合せ</span></div><div class="nowbar" id="nowbar" hidden></div>';
  D.schedule.forEach(function(p){
    h+='<div class="phase '+PH[p.name]+'"><h2>'+esc(p.name)+'<small>'+esc(p.span)+'</small></h2>';
    p.items.forEach(function(it,i){
      var tg=TAG[it.k];
      h+='<div class="row '+(RC[it.k]||'')+'" data-t="'+mins(it.t)+'"><div class="t">'+esc(it.t)+'</div><div class="m">'+(tg?'<span class="tag '+tg[1]+'">'+tg[0]+'</span>':'')+'<span class="x">'+esc(it.x)+'</span>'+it.sub.map(function(s){return '<div class="sub">'+esc(s)+'</div>';}).join('')+'</div></div>';
    });
    h+='</div>';
  });
  h+='<p class="note">主催者のタイムスケジュールをもとにしています。イベントスケジュールの詳細は別紙参照。</p>';
  document.getElementById('v-schedule').innerHTML=h;
  /* now / next on the day */
  function tick(){
    var now=new Date(), jst=new Date(now.getTime()+(now.getTimezoneOffset()+540)*60000);
    var day=jst.getFullYear()+'-'+(jst.getMonth()+1)+'-'+jst.getDate();
    var bar=document.getElementById('nowbar');
    document.querySelectorAll('.row.is-now').forEach(function(r){r.classList.remove('is-now');});
    if(day!=='2026-11-3'){bar.hidden=true;return;}
    var m=jst.getHours()*60+jst.getMinutes(), rows=[].slice.call(document.querySelectorAll('#v-schedule .row'));
    var stages=rows.filter(function(r){return r.classList.contains('r-st');});
    var next=stages.filter(function(r){return Number(r.dataset.t)>=m;})[0];
    var cur=null; rows.forEach(function(r){if(Number(r.dataset.t)<=m) cur=r;});
    if(cur) cur.classList.add('is-now');
    bar.hidden=false;
    bar.innerHTML='<b>いま '+jst.getHours()+':'+('0'+jst.getMinutes()).slice(-2)+'</b>'+(next?'<span>次のステージ：'+next.querySelector('.t').textContent+'　'+esc(next.querySelector('.x').textContent.replace(/\s*(パフォーマンス)?\s*(開始)$/,''))+'</span>':'<span>本日のステージは終了しました</span>');
  }
  tick(); setInterval(tick,60000);
  /* map */
  var mh='<div class="legend"><span><i class="sw peach"></i>出店ブース（数字＝配置図No）</span><span><i class="sw blue"></i>「6」＝共用テーブル席（机・イス）</span><span><i class="sw pink"></i>注意書き・横幕</span><span>連なったテント2つ→重り3個、3つ→重り4個</span></div>';
  D.blocks.forEach(function(b){
    mh+='<div class="mapcard"><h2>'+esc(b.title)+'<small>'+esc(b.sub)+'</small></h2><div class="mapscroll"><img src="'+b.map+'" alt="'+esc(b.title)+'の出店配置図" loading="lazy"></div></div>';
  });
  mh+='<p class="note">スマホでは地図を横にスクロールできます。</p><div class="rent"><div>テント　使用 <b>39</b> ／ レンタル <b>42</b></div><div>重り　使用 <b>66</b> ／ レンタル <b>66</b></div><div>机　使用 <b>133</b> ／ レンタル <b>138</b></div><div>椅子　使用 <b>236</b> ／ レンタル <b>230</b></div></div>';
  document.getElementById('v-map').innerHTML=mh;
  /* list */
  var SP={'本部テント':'sp-hq','マリンFM':'sp-fm','イベントステージエリア':'sp-st'};
  var state={blk:'all',q:'',fire:false};
  document.getElementById('v-list').innerHTML='<div class="tools"><button type="button" class="chip" data-b="all" aria-pressed="true">すべて</button><button type="button" class="chip" data-b="3" aria-pressed="false">3丁目</button><button type="button" class="chip" data-b="2" aria-pressed="false">2丁目</button><button type="button" class="chip" data-b="1" aria-pressed="false">1丁目</button><button type="button" class="chip" id="fire" aria-pressed="false">火器を使うブース</button><input class="search" id="q" type="search" placeholder="店名・Noで探す" aria-label="店名・Noで探す"></div><div id="listbody"></div>';
  function renderList(){
    var out='', q=state.q.trim().toLowerCase(), any=false;
    D.blocks.forEach(function(b){
      if(state.blk!=='all'&&state.blk!==b.id) return;
      var cards='', tot=null, tb={n:0,d:0,c:0};
      b.rows.forEach(function(r){
        if(r.total){tot=r;return;}
        if((r.no||'').indexOf('机')===0){ tb.n++; tb.d+=Number(r.desk)||0; tb.c+=Number(r.chair)||0; return; }
        var hay=(r.no+' '+(r.name||'')+' '+(r.item||'')).toLowerCase();
        if(q&&hay.indexOf(q)<0) return;
        var fire=r.equip&&r.equip!=='無し';
        if(state.fire&&!fire) return;
        any=true;
        var item=r.item==='横幕有り'?'<span class="lab flag">横幕有り</span>':esc(r.item||'');
        cards+='<div class="booth '+(SP[r.name]||'')+'"><div class="no">'+esc(r.no)+'</div><div class="nm">'+esc(r.name)+'</div><div class="it">'+item+(r.price?'<b>'+esc(r.price)+(/円/.test(r.price)?'':'円')+'</b>':'')+'</div>'+
          (r.desc?'<div class="ds">'+esc(r.desc)+'</div>':'')+
          '<div class="meta">'+(fire?'<span class="lab fire">'+esc(r.equip)+'</span>':'')+(r.ext&&r.ext!=='無し'?'<span>'+esc(r.ext)+'</span>':'')+
          '<span class="cnt">テント '+esc(r.tent||'–')+'・重り '+esc(r.weight||'–')+'・机 '+esc(r.desk||'–')+'・イス '+esc(r.chair||'–')+'</span></div></div>';
      });
      if(!cards) return;
      out+='<h2 class="blockh">'+esc(b.title)+'<small>'+esc(b.sub)+'</small></h2><div class="cards">'+cards+'</div>';
      if(!q&&!state.fire){
        if(tb.n) out+='<div class="tot"><span class="lab tbl">6 共用テーブル席</span> '+tb.n+'か所（机 '+tb.d+'・イス '+tb.c+'）　配置は「配置図」タブの「6」の位置です</div>';
        if(tot) out+='<div class="tot">'+esc(b.title)+' 合計（テーブル席を含む）：テント '+tot.tent+'・重り '+tot.weight+'・机 '+tot.desk+'・イス '+tot.chair+'</div>';
      }
    });
    document.getElementById('listbody').innerHTML=out||'<div class="empty">見つかりませんでした。</div>';
  }
  document.querySelectorAll('.chip[data-b]').forEach(function(c){c.onclick=function(){state.blk=c.dataset.b;document.querySelectorAll('.chip[data-b]').forEach(function(x){x.setAttribute('aria-pressed',String(x===c));});renderList();};});
  var fb=document.getElementById('fire'); fb.onclick=function(){state.fire=!state.fire;fb.setAttribute('aria-pressed',String(state.fire));renderList();};
  document.getElementById('q').addEventListener('input',function(e){state.q=e.target.value;renderList();});
  renderList();
  /* tabs */
  var views=['schedule','map','list'];
  function show(){var v=(location.hash||'').slice(1); if(views.indexOf(v)<0) v='schedule';
    views.forEach(function(n){document.getElementById('v-'+n).hidden=(n!==v);});
    document.querySelectorAll('nav.tabs a').forEach(function(a){if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
  window.addEventListener('hashchange',function(){show();window.scrollTo(0,0);}); show();
})();
</script>

</body>
</html>
